name: publish

# Publishes the package to npmjs (aifactory npm-package template, RQ-0151).
#
# - A pushed tag v<version>: checked against package.json, the four checks,
#   then npm publish, with provenance on a GitHub-hosted runner. The tag is
#   pushed by a person; an agent never creates one.
# - Run by hand: npm publish --dry-run of the default branch, unless a tag
#   is given, which is then published as a pushed one would be.
#
# Authentication: npm trusted publishing (OIDC) when this repository and this
# workflow are set up as the package's trusted publisher on npmjs.com; else the
# repository secret NPM_TOKEN (an npm automation or granular token). The first
# publish of a new package name may have to be made by hand. The README says how.
#
# The runner: the repository variable AIFACTORY_RUNS_ON (a JSON list of labels,
# e.g. ["self-hosted"]), else GitHub-hosted ubuntu-latest (RQ-0152). npm issues
# provenance only on a GitHub-hosted runner; a self-hosted one publishes without it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A v* tag to publish (empty runs npm publish --dry-run of the default branch)
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.AIFACTORY_RUNS_ON || '["ubuntu-latest"]') }}
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm and an npm with trusted publishing
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
          npm install -g npm@^11.5.1

      - name: The tag is the package.json version
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not v$version, the version in package.json. Set the version, commit, and tag that commit."
            exit 1
          fi

      - name: package.json names this repository
        # npm provenance refuses a package whose repository is not the one the
        # workflow runs in; say so before the checks, not after them. Checked on
        # every runner, so a move to a GitHub-hosted one does not surprise.
        run: |
          url="$(node -p "const r = require('./package.json').repository; (typeof r === 'string' ? r : (r && r.url) || '')")"
          case "$url" in
            *"github.com/$GITHUB_REPOSITORY"|*"github.com/$GITHUB_REPOSITORY.git"|*"github.com:$GITHUB_REPOSITORY"|*"github.com:$GITHUB_REPOSITORY.git") ;;
            *)
              echo "::error::package.json repository is \"$url\", not this repository. Set it to {\"type\": \"git\", \"url\": \"git+https://github.com/$GITHUB_REPOSITORY.git\"}: npm provenance checks it."
              exit 1
              ;;
          esac

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check

      - name: Publish
        if: env.TAG != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm issues provenance only on a GitHub-hosted runner (RQ-0153: the
          # runner context exists in a step, not in the job's env).
          provenance=""
          [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && provenance="--provenance"
          [ -n "$provenance" ] || echo "::notice::A self-hosted runner: published without npm provenance."
          npm publish $provenance --access public

      - name: Publish (dry run)
        if: env.TAG == ''
        run: |
          provenance=""
          [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && provenance="--provenance"
          npm publish $provenance --access public --dry-run
