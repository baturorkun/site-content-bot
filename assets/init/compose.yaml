# site-content-bot for this site: the published image, nothing built here.
# Settings come from the .env next to this file on the host, written by
# `site-content-bot init`, never from the repository; compose reads the same
# .env for the names and the port below. Run it with `site-content-bot start`
# (stop, logs, status, update, login).
name: ${CONTENT_BOT_CONTAINER:-site-content-bot}
services:
  content-bot:
    image: ${CONTENT_BOT_IMAGE:-ghcr.io/baturorkun/site-content-bot:{{version}}}
    container_name: ${CONTENT_BOT_CONTAINER:-site-content-bot}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CONTENT_BOT_HOST_PORT:-8290}:8290"
    volumes:
      - content-bot-data:/data

volumes:
  content-bot-data: {}
