# site-content-bot for this site. Settings come from a .env next to this file
# on the host, never from the repository (.env.example lists them).
services:
  content-bot:
    build: .
    image: site-content-bot:local
    container_name: site-content-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8290:8290"
    volumes:
      - content-bot-data:/data

volumes:
  content-bot-data: {}
