# site-content-bot for this site. Settings come from a .env next to this file
# on the host, written by `site-content-bot init`, never from the repository.
# The same .env gives CONTENT_BOT_HOST_PORT below (compose reads it from here).
services:
  content-bot:
    build: .
    image: site-content-bot:local
    container_name: site-content-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CONTENT_BOT_HOST_PORT:-8290}:8290"
    volumes:
      - content-bot-data:/data

volumes:
  content-bot-data: {}
